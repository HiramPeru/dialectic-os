name: Supabase Keepalive

on:
  schedule:
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - agent/supabase-keepalive
    paths:
      - .github/workflows/supabase-keepalive.yml

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Query Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://kcnplzxfjtquajsalgzj.supabase.co
      # Publishable keys are designed for client exposure; RLS limits access.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_d0YLmrM6XuTnpeUvAFAFwg_cLw1OQ66
    steps:
      - name: Read keepalive probe
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 5 --max-time 30 \
              --get "${SUPABASE_URL}/rest/v1/system_keepalive" \
              --data-urlencode "select=id" \
              --data-urlencode "limit=1" \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Accept: application/json"
          )"

          if [[ "${response}" != '[{"id":1}]' ]]; then
            printf 'Unexpected keepalive response: %s\n' "${response}" >&2
            exit 1
          fi

          printf 'Supabase keepalive succeeded at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
